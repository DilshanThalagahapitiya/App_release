<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Worker config</title>
<style>
  :root { --bg:#f0f2f5; --card:#fff; --line:#e4e8ee; --text:#14171f; --muted:#6b7385; --blue:#2a7de1; --blue-d:#1c66c2; --green:#3a9a22; --red:#c0392b; --amber:#9a5b00; }
  @media (prefers-color-scheme: dark) { :root { --bg:#0e1116; --card:#161a22; --line:#272d39; --text:#e8ebf1; --muted:#8a93a6; --blue:#5aa2ff; --blue-d:#7db5ff; --green:#4cb02f; --red:#ff8a80; --amber:#f0b24a; } }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--text); font:15px/1.5 -apple-system, "Inter", system-ui, sans-serif; }
  header { background:var(--card); border-bottom:3px solid var(--blue); padding:14px 20px; display:flex; align-items:center; gap:12px; }
  .logo { width:36px; height:36px; border-radius:10px; background:var(--blue); color:#fff; display:flex; align-items:center; justify-content:center; font-weight:700; }
  header b { font-size:18px; } header span { color:var(--muted); font-size:12px; display:block; line-height:1.1; }
  main { max-width:760px; margin:0 auto; padding:20px; display:grid; gap:16px; }
  .card { background:var(--card); border:1px solid var(--line); border-radius:14px; padding:20px; box-shadow:0 2px 10px rgba(30,60,110,.06); }
  h2 { margin:0 0 12px; font-size:17px; }
  .status { display:flex; align-items:center; gap:14px; }
  .dot { width:16px; height:16px; border-radius:50%; background:#9aa3b2; flex:none; }
  .dot.on { background:var(--green); box-shadow:0 0 0 5px rgba(58,154,34,.2); }
  .big { font-size:22px; font-weight:700; } .muted { color:var(--muted); font-size:13px; }
  .row { display:flex; gap:10px; flex-wrap:wrap; margin-top:16px; }
  button { font:inherit; font-weight:600; border-radius:10px; padding:10px 18px; border:2px solid var(--line); background:var(--card); color:var(--text); cursor:pointer; }
  button:disabled { opacity:.5; cursor:not-allowed; }
  .go { background:var(--green); border-color:var(--green); color:#fff; } .stop { background:var(--red); border-color:var(--red); color:#fff; }
  .blue { border-color:var(--blue); color:var(--blue); }
  label { display:block; font-weight:600; margin:14px 0 6px; font-size:13px; }
  input { width:100%; padding:10px 12px; border:1px solid var(--line); border-radius:10px; font:inherit; background:var(--card); color:var(--text); }
  .keybox { display:flex; gap:8px; } .keybox input { flex:1; }
  #msg { min-height:22px; margin-top:12px; font-weight:600; } .ok { color:var(--green); } .err { color:var(--red); }
  pre { background:#0e1116; color:#d7dde8; padding:14px; border-radius:10px; overflow:auto; max-height:300px; font:12px/1.5 ui-monospace, Menlo, monospace; white-space:pre-wrap; margin:0; }
  .pill { display:inline-block; padding:2px 10px; border-radius:99px; background:var(--line); font-size:12px; }
</style>
</head>
<body>
<header><div class="logo">C</div><div><b>Worker config</b><span>Crede App Release Portal · this Mac</span></div></header>
<main>
  <section class="card">
    <div class="status"><div id="dot" class="dot"></div><div><div id="state" class="big">Checking…</div><div id="sub" class="muted"></div></div></div>
    <div class="row">
      <button id="start" class="go">▶ Start worker</button>
      <button id="stop" class="stop">■ Stop worker</button>
      <button id="restart">↻ Restart</button>
      <button id="test" class="blue">Test connection</button>
    </div>
    <div id="msg" role="status"></div>
  </section>

  <section class="card">
    <h2>Worker key</h2>
    <p class="muted" style="margin:0">Get it on the website: <b>Worker &amp; Processing → Register worker</b>. It is shown only once, so paste it here right away.</p>
    <label for="url">Platform address</label>
    <input id="url" placeholder="https://ipa-platform-prod.yourname.workers.dev" autocomplete="off" spellcheck="false">
    <label for="key">Worker key <span id="keyNow" class="pill"></span></label>
    <div class="keybox"><input id="key" type="password" placeholder="wkr_… (leave empty to keep the current key)" autocomplete="off" spellcheck="false"><button id="eye" type="button" aria-label="Show or hide the key">👁</button></div>
    <div class="row"><button id="save" class="go">Save</button></div>
    <p class="muted">Saved on this Mac only, in <span id="cfgFile"></span> (readable only by you).</p>
  </section>

  <section class="card">
    <h2>Log</h2>
    <pre id="log">Nothing yet.</pre>
    <p class="muted" id="logFile"></p>
  </section>
</main>
<script>
const T = "__TOKEN__";
const $ = (id) => document.getElementById(id);
const say = (t, ok = true) => { $("msg").textContent = t; $("msg").className = ok ? "ok" : "err"; };
async function api(path, body) {
  const r = await fetch(path, { method: body === undefined ? "GET" : "POST", headers: { "x-config-token": T, "content-type": "application/json" }, body: body === undefined ? undefined : JSON.stringify(body) });
  return r.json();
}
let busy = false, loadedForm = false;
async function refresh() {
  try {
    const s = await api("/api/status");
    $("dot").className = "dot" + (s.running ? " on" : "");
    $("state").textContent = s.running ? "Worker is running" : "Worker is stopped";
    $("sub").textContent = s.running ? `Up for ${s.uptime || "…"} · process ${s.pids.join(", ")}` : (s.keySet ? "Press Start to begin checking uploads." : "Add your worker key below first.");
    $("start").disabled = busy || s.running; $("stop").disabled = busy || !s.running; $("restart").disabled = busy || !s.running; $("test").disabled = busy;
    if (!loadedForm) { $("url").value = s.platformUrl; loadedForm = true; }
    $("keyNow").textContent = s.keySet ? "current: " + s.keyPreview : "not set";
    $("cfgFile").textContent = s.configFile; $("logFile").textContent = s.logFile;
    const log = $("log"); const atEnd = log.scrollTop + log.clientHeight >= log.scrollHeight - 30;
    log.textContent = s.log || "Nothing yet."; if (atEnd) log.scrollTop = log.scrollHeight;
  } catch { $("state").textContent = "Cannot reach Worker config"; $("sub").textContent = "Is the terminal window still open?"; }
}
async function act(path, body, label) {
  busy = true; say(label + "…"); await refresh();
  try { const r = await api(path, body); say(r.message || (r.ok ? "Done." : "Failed."), !!r.ok); if (r.ok && body && body.workerKey) $("key").value = ""; } catch { say("Something went wrong.", false); }
  busy = false; await refresh();
}
$("start").onclick = () => act("/api/start", {}, "Starting");
$("stop").onclick = () => act("/api/stop", {}, "Stopping");
$("restart").onclick = () => act("/api/restart", {}, "Restarting");
$("test").onclick = () => act("/api/test", {}, "Testing the connection");
$("save").onclick = () => act("/api/config", { platformUrl: $("url").value, workerKey: $("key").value }, "Saving");
$("eye").onclick = () => { $("key").type = $("key").type === "password" ? "text" : "password"; };
refresh(); setInterval(() => { if (!busy) refresh(); }, 3000);
</script>
</body>
</html>
